# EXP005: corrected data3 manual-label export with fixed class 22/23 mapping.
# Keep EXP002 settings and initialization fixed to isolate the data correction.

task: detect
mode: train

model: submit/v2/models/best.pt
data: shiyan/configs/dataset/weixing_data3_v2_audited.yaml

epochs: 150
# The dedicated launcher disables native early stopping for epochs 1-100,
# then enables a fresh 30-epoch patience window from epoch 101.
patience: 0
batch: 4
imgsz: 1024
device: 0
workers: 4

project: runs/train
name: exp005_data3_manual_revision_classfix
exist_ok: false

pretrained: false
optimizer: auto
seed: 20260902
deterministic: true
single_cls: false
rect: false
cos_lr: true
close_mosaic: 10
amp: true
cache: false
plots: true
save: true
save_period: 10
val: true
verbose: true
